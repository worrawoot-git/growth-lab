<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth Lab – วิเคราะห์ทฤษฎีการเติบโตทางเศรษฐกิจ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2f4;--surf:#fff;--ink:#12252d;--mut:#55707b;--line:#cfdadf;--acc:#0f6b78;--accink:#fff;--soft:#e1eef0;--bad:#a23b2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a1f;--surf:#152730;--ink:#e6eff2;--mut:#8fa8b2;--line:#2a4350;--acc:#4fb6c4;--accink:#06242a;--soft:#1c3640;--bad:#ef8e7c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a1f;--surf:#152730;--ink:#e6eff2;--mut:#8fa8b2;--line:#2a4350;--acc:#4fb6c4;--accink:#06242a;--soft:#1c3640;--bad:#ef8e7c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.2;margin:0 0 6px;font-weight:700}
header p{margin:0;color:var(--mut);max-width:60ch}
h2{font-size:1.15rem;margin:0 0 12px;display:flex;gap:10px;align-items:center}
h2 .no{background:var(--acc);color:var(--accink);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:.85rem;flex:none}
h3{margin:22px 0 8px;font-size:1rem}
section.box{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:9px 16px;min-height:42px}
button:hover:not(:disabled){border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg button{border-radius:0;min-width:56px}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.model{text-align:left;padding:14px 16px;border-left:5px solid var(--line);display:block;height:100%}
.model b{display:block;font-size:1.05rem}.model span{display:block;color:var(--mut);font-size:.9rem;line-height:1.5;margin-top:4px}
.model[aria-pressed=true]{border-color:var(--acc);border-left-color:var(--acc);background:var(--soft)}
.req{margin:12px 0 0;color:var(--mut);font-size:.92rem}
code{background:var(--soft);padding:1px 6px;border-radius:4px;font-size:.88em}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
input[type=file]{max-width:100%}
.prms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0 16px}
.prm{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:500}
.prm input{font:inherit;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);min-height:42px;width:100%}
.prm small{color:var(--mut);font-size:.8rem;line-height:1.4;font-weight:400}
#params .req{margin-top:0}
#msg{min-height:24px;margin-top:10px;font-size:.95rem}#msg.err{color:var(--bad)}#msg.ok{color:var(--acc)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th,td{text-align:left;vertical-align:middle}
th{background:var(--soft);font-weight:500}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td.txt{white-space:normal;min-width:16ch}
table.kv{width:auto;min-width:min(100%,560px)}
table.kv th:first-child,table.kv td:first-child{white-space:normal;min-width:22ch}
.tw:has(table.kv){width:fit-content;max-width:100%}
table.wide{width:max-content;min-width:100%}
tr:last-child td{border-bottom:0}
.notes{margin-top:22px;padding:14px 16px;background:var(--soft);border-radius:8px}
.notes h3{margin-top:0}.notes dl{margin:0}.notes dt{font-weight:700;margin-top:8px}.notes dd{margin:0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px;margin-top:14px}
.card{background:#fff;color:#222;border:1px solid var(--line);border-radius:8px;padding:12px}
.card .cv{position:relative;height:300px}
.card button{margin-top:8px;background:#fff;color:#12252d;border-color:#b9c7cd;min-height:36px;padding:5px 12px;font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1 data-i="title"></h1><p data-i="sub"></p></div>
 <div class="row"><div class="seg" role="group" aria-label="Language"><button id="bth" aria-pressed="true">ไทย</button><button id="ben" aria-pressed="false">EN</button></div>
 <button id="reset" data-i="reset"></button></div>
</header>

<section class="box"><h2><span class="no">1</span><span data-i="s1"></span></h2>
 <div class="models" id="models"></div>
 <p class="req" id="req"></p></section>

<section class="box"><h2><span class="no">2</span><span data-i="s2"></span></h2>
 <div class="drop"><input type="file" id="file" accept=".xlsx,.xls,.csv" aria-label="Excel"></div>
 <div class="row"><button id="try" data-i="try"></button><button id="dlsample" data-i="dlsample"></button></div>
 <div id="msg" role="status"></div></section>

<section class="box"><h2><span class="no">3</span><span data-i="s3"></span></h2>
 <div id="params" hidden></div>
 <button class="pri" id="run" data-i="run" disabled></button></section>

<div id="out" hidden>
 <section class="box"><h2><span data-i="resh"></span></h2><div id="tables"></div>
  <div class="notes"><h3 data-i="expl"></h3><dl id="notes"></dl></div>
  <div class="row" style="margin-top:14px"><button id="dlx" class="pri" data-i="dlx"></button><button id="showc" data-i="showc"></button></div></section>
 <section class="box" id="chartbox" hidden><h2 data-i="chh"></h2><div class="grid" id="charts"></div></section>
</div>
</div>

const sum=a=>a.reduce((s,v)=>s+v,0),mean=a=>sum(a)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(sum(a.map(v=>(v-m)**2))/(a.length-1))};
const cor=(a,b)=>{const ma=mean(a),mb=mean(b);return sum(a.map((v,i)=>(v-ma)*(b[i]-mb)))/Math.sqrt(sum(a.map(v=>(v-ma)**2))*sum(b.map(v=>(v-mb)**2)))};
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,s=x+5.5;s-=(x+.5)*Math.log(s);let z=1.000000000190015;for(const v of c)z+=v/++y;return -s+Math.log(2.5066282746310005*z/x)}
function bcf(a,b,x){const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-9)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b}
const tp=(x,df)=>ib(df/(df+x*x),df/2,.5),fp=(F,d1,d2)=>ib(d2/(d2+d1*F),d2/2,d1/2);
function tcrit(df){let lo=0,hi=60;for(let i=0;i<50;i++){const m=(lo+hi)/2;tp(m,df)>.05?lo=m:hi=m}return lo}
function inv(A){const n=A.length,M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>+(i==j))]);for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i];if(Math.abs(d)<1e-14)throw Error('Singular matrix (perfect collinearity?)');for(let j=0;j<2*n;j++)M[i][j]/=d;for(let r=0;r<n;r++)if(r!=i){const f=M[r][i];for(let j=0;j<2*n;j++)M[r][j]-=f*M[i][j]}}return M.map(r=>r.slice(n))}
function ols(X,y){const n=y.length,k=X.length+1;if(n<=k)throw Error('n ≤ k');const R=y.map((_,i)=>[1,...X.map(c=>c[i])]);
 const XtX=Array.from({length:k},(_,a)=>Array.from({length:k},(_,b)=>sum(R.map(r=>r[a]*r[b]))));const Xty=Array.from({length:k},(_,a)=>sum(R.map((r,i)=>r[a]*y[i])));

 if(m=='hd'){let Y=1000;for(let i=0;i<N;i++){const S=Y*(.2+.04*r()),I=S*(1+.04*r()),L=r2(500*1.018**i);o.push({Year:2000+i,Y:r2(Y),S:r2(S),I:r2(I),L});Y+=I/3.5*(1+.5*r())}}
 if(m=='so'){let K=300;for(let i=0;i<N;i++){const L=100*1.015**i*(1+.01*r()),A=1.01**i,Y=A*K**.35*L**.65*Math.exp(.02*r()),I=.22*Y*(1+.2*r());o.push({Year:2000+i,Y:r2(Y),K:r2(K),L:r2(L),I:r2(I)});K=K*.95+I}}
 if(m=='ng'){let K=200,L=100,H=50,R=10;for(let i=0;i<N;i++){const Y=Math.exp(.5)*K**.3*L**.35*H**.25*R**.15*Math.exp(.02*r());o.push({Year:1995+i,Y:r2(Y),K:r2(K),L:r2(L),H:r2(H),RD:r2(R)});K*=1.05+.04*r();L*=1.015+.02*r();H*=1.03+.03*r();R*=1.06+.08*r()}}
 return o}

/* ---------- UI ---------- */
function msg(s,c){const m=$('msg');m.textContent=s;m.className=c||''}
function renderParams(){const box=$('params');if(!model||!PK[model]){box.innerHTML='';box.hidden=true;return}box.hidden=false;
 box.innerHTML=`<p class="req">${t('prmh')}</p><div class="prms">`+PK[model].map(k=>`<label class="prm"><span>${t('p_'+k)}</span><input type="number" step="0.1" inputmode="decimal" data-k="${k}" value="${PV[model][k]}" placeholder="${t('auto')}"><small>${t('h_'+model+'_'+k)}</small></label>`).join('')+'</div>';
 box.querySelectorAll('input').forEach(el=>el.oninput=()=>{PV[model][el.dataset.k]=el.value;clearTimeout(tmr);tmr=setTimeout(()=>{if(res&&raw)analyze(true)},350)})}
function renderModels(){$('models').innerHTML=['hd','so','ng'].map(k=>`<button class="model" data-m="${k}" aria-pressed="${model==k}"><b>${t(k)}</b><span>${t('d'+k)}</span></button>`).join('');
 document.querySelectorAll('.model').forEach(b=>b.onclick=()=>{model=b.dataset.m;res=null;$('out').hidden=true;renderModels();upd()});
 $('req').innerHTML=model?t('req')+'<code>'+DESC[model]+'</code>'+(ODESC[model]?t('optl')+'<code>'+ODESC[model]+'</code>':''):'';renderParams()}
function upd(){$('run').disabled=!(model&&raw)}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('bth').setAttribute('aria-pressed',lang=='th');$('ben').setAttribute('aria-pressed',lang=='en');renderModels();if(raw)msg(t('loaded')+fname+' ('+raw.length+t('rows')+')','ok');if(res){show();if(showCh)drawCharts()}}
const num=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(+v);
function parse(rows,m){const norm=rows.map(r=>{const o={};for(const k in r){let n=String(k).trim().toLowerCase();o[ALIAS[n]||n]=r[k]}return o});
 const miss=REQ[m].filter(c=>!(c in (norm[0]||{})));if(miss.length)throw Error(t('miss')+miss.join(', '));
 const ok=norm.filter(r=>REQ[m].every(c=>num(r[c]))).sort((a,b)=>a.year-b.year);
 if(ok.length<MIN[m])throw Error(t('few')+MIN[m]);const d={};REQ[m].forEach(c=>d[c]=ok.map(r=>+r[c]));
 if(REQ[m].some(c=>c!='year'&&d[c].some(v=>v<=0)))throw Error(t('pos'));
 OPT[m].forEach(c=>{if(ok.every(r=>num(r[c])&&+r[c]>0))d[c]=ok.map(r=>+r[c])});return d}
function getP(m){const o={};(PK[m]||[]).forEach(k=>{const v=String(PV[m][k]).trim();if(v===''){o[k]=null;return}const x=+v;if(!Number.isFinite(x))throw Error(t('badp'));o[k]=x/100});return o}
const isNum=c=>/^\s*(?:[<+\-−]?\d[\d.,]*(?:e[+-]?\d+)?\s*\**|–)\s*$/i.test(String(c));
function show(){const secs=build(res);$('tables').innerHTML=secs.map(s=>{
 const nc=s.head.length,num=s.head.map((_,j)=>{const v=s.rows.map(r=>r[j]).filter(c=>c!==undefined&&c!=='');return j>0&&v.length&&v.filter(isNum).length>=v.length/2});
 const cls=['kv',nc>=6?'wide':''].filter((x,i)=>i?x:nc==2).join(' ');
 const td=(c,j)=>{const n=num[j]&&isNum(c);return`<td class="${n?'n':(j&&String(c).length>24?'txt':'')}">${c}</td>`};
 return`<h3>${s.title}</h3><div class="tw"><table class="${cls}"><thead><tr>${s.head.map((h,j)=>`<th${num[j]?' class="n"':''}>${h}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${s.head.map((_,j)=>td(r[j]??'',j)).join('')}</tr>`).join('')}</tbody></table></div>`}).join('');
 $('notes').innerHTML=NOTES[res.type].map(k=>`<dt>${t('N')[k][0]}</dt><dd>${t('N')[k][1]}</dd>`).join('');$('out').hidden=false}
function analyze(quiet){if(!model)return msg(t('pick'),'err');if(!raw)return msg(t('nodata'),'err');
 try{const d=parse(raw,model),p=getP(model);res=model=='hd'?aHD(d,p):model=='so'?aSO(d,p):aNG(d);show();msg(t('done'),'ok');if(showCh)drawCharts();if(!quiet)$('out').scrollIntoView({behavior:'smooth'})}catch(x){res=null;$('out').hidden=true;msg(t('err')+x.message,'err')}}
$('bth').onclick=()=>{lang='th';applyLang()};$('ben').onclick=()=>{lang='en';applyLang()};
$('file').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null});fname=fl.name;msg(t('loaded')+fname+' ('+raw.length+t('rows')+')','ok');res=null;$('out').hidden=true;upd()}catch(x){raw=null;msg(t('err')+x.message,'err');upd()}};rd.readAsArrayBuffer(fl)};
$('try').onclick=()=>{if(!model)return msg(t('pick'),'err');raw=sample(model);fname='sample';msg(t('loaded')+fname+' ('+raw.length+t('rows')+')','ok');res=null;$('out').hidden=true;upd()};
$('dlsample').onclick=()=>{if(!model)return msg(t('pick'),'err');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sample(model),{header:HDR[model]}),'Data');XLSX.writeFile(wb,'sample_'+model+'.xlsx')};
$('run').onclick=()=>analyze(false);
$('dlx').onclick=()=>{const wb=XLSX.utils.book_new();build(res).forEach((s,i)=>{const ws=XLSX.utils.aoa_to_sheet([s.head,...s.rows]);XLSX.utils.book_append_sheet(wb,ws,((i+1)+'_'+s.title).replace(/[\[\]:*?\/\\]/g,'').slice(0,31))});
 const nt=NOTES[res.type].map(k=>[t('N')[k][0],t('N')[k][1]]);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[t('term'),t('expl')],...nt]),'Notes');XLSX.writeFile(wb,'analysis_'+res.type+'.xlsx')};
$('showc').onclick=()=>{showCh=true;$('chartbox').hidden=false;drawCharts();$('chartbox').scrollIntoView({behavior:'smooth'})};
$('reset').onclick=()=>{model=null;raw=null;res=null;fname='';showCh=false;PV=JSON.parse(JSON.stringify(P0));charts.forEach(c=>c.destroy());charts=[];$('file').value='';$('out').hidden=true;$('chartbox').hidden=true;$('charts').innerHTML='';msg('');renderModels();upd()};
applyLang();
</script>
</body>
</html>
